<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050816"/><stop offset="50%" stop-color="#101044"/><stop offset="100%" stop-color="#220b35"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6c63ff"/><stop offset=".5" stop-color="#00d9ff"/><stop offset="1" stop-color="#ff65c3"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:white}.sub{font:500 18px Arial,sans-serif;fill:#d9d7ff}.small{font:600 14px monospace;fill:#a9a5ff}
    .pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.blink{animation:blink 1.8s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.45;transform:scale(1.08)}} @keyframes float{50%{transform:translateY(-12px)}} @keyframes blink{50%{opacity:.25}}
  </style>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<circle class="pulse" cx="150" cy="40" r="90" fill="#6c63ff" opacity=".18" filter="url(#blur)"/>
<circle class="pulse" cx="1050" cy="250" r="110" fill="#ff4fc3" opacity=".16" filter="url(#blur)"/>
<g class="float" opacity=".8"><circle cx="80" cy="80" r="3" fill="#fff"/><circle cx="1110" cy="65" r="4" fill="#8eeaff"/><circle cx="1010" cy="45" r="2" fill="#fff"/><circle cx="260" cy="240" r="3" fill="#ff9be0"/><circle cx="920" cy="220" r="3" fill="#fff"/></g>
<rect x="42" y="38" width="1116" height="224" rx="22" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".7"/>
<text x="600" y="105" text-anchor="middle" class="title">Sri Sakthi Eswari</text>
<text x="600" y="140" text-anchor="middle" class="sub">ECE Student  •  Web Development  •  UI/UX  •  AI Explorer</text>
<text x="600" y="185" text-anchor="middle" class="small">&lt; BUILD • LEARN • CREATE • REPEAT /&gt;</text>
<g class="blink"><text x="600" y="220" text-anchor="middle" class="sub">Turning ideas into real projects ✦</text></g>
<path d="M360 235 Q600 270 840 235" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
<g class="float"><text x="90" y="225" class="small">ECE → SOFTWARE</text><text x="970" y="225" class="small">2029 • KEEP GROWING</text></g>
</svg>